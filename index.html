<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Asistente técnico del Departamento de Comunicaciones - IPUC Central Cali">
  <link rel="icon" href="assets/favicon.png" type="image/png" sizes="32x32">
  <title>Asistente DECOM · IPUC Central Cali</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/chat.css">
</head>
<body>
  
  <!-- Sidebar -->
  <nav class="sidebar">
    <!-- Brand -->
    <div class="sidebar__brand">
      <div class="sidebar__brand-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="sidebar__brand-text">DECOM</span>
    </div>

    <!-- Nav -->
    <div class="sidebar__nav">
      <a href="index.html" class="sidebar__link sidebar__link--active" data-tooltip="Asistente">
        <div class="sidebar__icon">
          <svg viewBox="0 0 24 24">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <span class="sidebar__text">Asistente</span>
      </a>
      
      <a href="manuales.html" class="sidebar__link" data-tooltip="Manuales">
        <div class="sidebar__icon">
          <svg viewBox="0 0 24 24">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
        </div>
        <span class="sidebar__text">Manuales</span>
      </a>
      
      <a href="cronograma.html" class="sidebar__link" data-tooltip="Cronograma">
        <div class="sidebar__icon">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
        <span class="sidebar__text">Cronograma</span>
      </a>
    </div>

    <!-- Footer -->
    <div class="sidebar__footer">
      <div class="sidebar__user">
        <div class="sidebar__avatar">DC</div>
        <div class="sidebar__user-info">
          <div class="sidebar__user-name">DECOM</div>
          <div class="sidebar__user-role">IPUC Cali</div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Mobile Menu Toggle -->
  <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- Chat Container -->
  <div class="chat">
    
    <!-- Header -->
    <div class="chat__header">
      <div class="chat__header-left">
        <div class="chat__logo">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="chat__title">
          <h1>Asistente DECOM</h1>
          <div class="chat__subtitle">IPUC Central Cali · Luces · Transmisión · Proyección</div>
        </div>
      </div>
      <div class="chat__status">
        <div class="chat__status-dot"></div>
        En línea
      </div>
    </div>

    <!-- Area Chips -->
    <div class="chat__chips">
      <span class="chip chip--luces">Luces</span>
      <span class="chip chip--transm">Transmisión</span>
      <span class="chip chip--proyec">Proyección</span>
    </div>

    <!-- Status en línea mobile (debajo de chips) -->
    <div class="chat__status chat__status--mobile">
      <div class="chat__status-dot"></div>
      En línea
    </div>

    <!-- Chat Window -->
    <div class="chat__window">
      <div id="messages" class="chat__messages"></div>
      
      <div class="chat__input-area">
        <textarea 
          id="user-input" 
          class="chat__input"
          rows="1" 
          placeholder="Describe tu problema o escribe tu pregunta..."
          aria-label="Mensaje"
        ></textarea>
        <button 
          id="send-btn" 
          class="chat__send-btn"
          aria-label="Enviar mensaje"
        >➤</button>
      </div>
    </div>

    <!-- Footer -->
    <div class="chat__footer">
      <div class="chat__footer-note">Asistente técnico · DECOM 2026</div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/sidebar.js"></script>
  <script type="module" src="js/chat.js"></script>

</body>
</html>

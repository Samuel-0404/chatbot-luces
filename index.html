<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Asistente técnico del Departamento de Comunicaciones - IPUC Central Cali">
  <title>Asistente DECOM · IPUC Central Cali</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/chat.css">
</head>
<body>
  
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar__container">
      <a href="index.html" class="navbar__brand">
        <div class="navbar__brand-icon">⚙️</div>
        <div class="navbar__brand-text">
          <div class="navbar__brand-title">DECOM</div>
          <div class="navbar__brand-subtitle">IPUC Central Cali</div>
        </div>
      </a>
      
      <button class="navbar__toggle" aria-label="Menú" aria-expanded="false">☰</button>
      
      <div class="navbar__nav">
        <a href="index.html" class="navbar__link active">💬 Asistente</a>
        <a href="manuales.html" class="navbar__link">📋 Manuales</a>
        <a href="cronograma.html" class="navbar__link">📅 Cronograma</a>
      </div>
    </div>
  </nav>

  <!-- Chat Container -->
  <div class="chat">
    
    <!-- Header -->
    <div class="chat__header">
      <div class="chat__header-left">
        <div class="chat__logo">⚙️</div>
        <div class="chat__title">
          <h1>Asistente DECOM</h1>
          <div class="chat__subtitle">IPUC Central Cali · Luces · Transmisión · Proyección</div>
        </div>
      </div>
      <div class="chat__status">
        <div class="chat__status-dot"></div>
        En línea
      </div>
    </div>

    <!-- Area Chips -->
    <div class="chat__chips">
      <span class="chip chip--luces">💡 Luces</span>
      <span class="chip chip--transm">📡 Transmisión</span>
      <span class="chip chip--proyec">🎥 Proyección</span>
    </div>

    <!-- Chat Window -->
    <div class="chat__window">
      <div id="messages" class="chat__messages"></div>
      
      <div class="chat__input-area">
        <textarea 
          id="user-input" 
          class="chat__input"
          rows="1" 
          placeholder="Describe tu problema o escribe tu pregunta..."
          aria-label="Mensaje"
        ></textarea>
        <button 
          id="send-btn" 
          class="chat__send-btn"
          aria-label="Enviar mensaje"
        >➤</button>
      </div>
    </div>

    <!-- Footer -->
    <div class="chat__footer">
      <div class="chat__footer-note">Asistente técnico · DECOM 2026</div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/navbar.js"></script>
  <script type="module" src="js/chat.js"></script>

</body>
</html>

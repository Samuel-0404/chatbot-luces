<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente de Luces · IPUC Central Cali</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --surface2: #1a1e28;
    --border: rgba(255,255,255,0.07);
    --accent: #4f7fff;
    --accent2: #7c5cff;
    --gold: #f0c060;
    --text: #e8eaf0;
    --text-muted: #6b7280;
    --danger: #ef4444;
    --success: #22c55e;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -30%;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(79,127,255,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    bottom: -20%;
    right: -10%;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(124,92,255,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  #app {
    width: 100%;
    max-width: 760px;
    height: 100vh;
    max-height: 780px;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
    animation: fadeUp 0.5s ease;
  }

  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0 20px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo {
    width: 42px; height: 42px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(79,127,255,0.25), rgba(124,92,255,0.25));
    border: 1px solid rgba(79,127,255,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  .header-title h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 17px;
    font-weight: 400;
    color: var(--text);
  }

  .header-title span {
    font-size: 12px;
    color: var(--text-muted);
  }

  .status-dot {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-muted);
  }

  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--success);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .chat-wrap {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    display: flex;
    gap: 10px;
    animation: fadeUp 0.3s ease;
    max-width: 88%;
  }

  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.bot  { align-self: flex-start; }

  .msg-avatar {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }

  .msg.bot .msg-avatar {
    background: linear-gradient(135deg, rgba(79,127,255,0.2), rgba(124,92,255,0.2));
    border: 1px solid rgba(79,127,255,0.2);
  }

  .msg.user .msg-avatar {
    background: var(--surface2);
    border: 1px solid var(--border);
  }

  .bubble {
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.65;
  }

  .msg.bot .bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
    color: var(--text);
  }

  .msg.user .bubble {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-top-right-radius: 4px;
    color: white;
  }

  .bubble ol { padding-left: 18px; margin: 6px 0; }
  .bubble ul { padding-left: 18px; margin: 6px 0; }
  .bubble li { margin: 5px 0; }
  .bubble strong { color: var(--gold); font-weight: 500; }
  .msg.user .bubble strong { color: rgba(255,255,255,0.9); }
  .bubble br + br { display: block; margin: 4px 0; content: ''; }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 10px;
  }

  .suggestion-btn {
    padding: 6px 12px;
    border: 1px solid rgba(79,127,255,0.3);
    border-radius: 999px;
    background: rgba(79,127,255,0.06);
    color: var(--accent);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .suggestion-btn:hover {
    background: rgba(79,127,255,0.15);
    border-color: rgba(79,127,255,0.5);
  }

  .typing-dots {
    display: flex; align-items: center; gap: 4px;
    padding: 14px 16px;
  }

  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  .input-area {
    border-top: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface);
  }

  #user-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    resize: none;
    outline: none;
    min-height: 42px;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }

  #user-input:focus { border-color: rgba(79,127,255,0.4); }
  #user-input::placeholder { color: var(--text-muted); }

  #send-btn {
    width: 42px; height: 42px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
    transition: opacity 0.2s, transform 0.1s;
  }

  #send-btn:hover { opacity: 0.85; }
  #send-btn:active { transform: scale(0.95); }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .app-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0 0;
  }

  .footer-note { font-size: 11px; color: var(--text-muted); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div id="app">
  <div class="app-header">
    <div class="header-left">
      <div class="logo">💡</div>
      <div class="header-title">
        <h2>Asistente de Luces</h2>
        <span>IPUC Central Cali · Manual ADJ myDMX 3</span>
      </div>
    </div>
    <div class="status-dot">
      <div class="dot"></div>
      En línea
    </div>
  </div>

  <div class="chat-wrap">
    <div id="messages"></div>
    <div class="input-area">
      <textarea id="user-input" rows="1" placeholder="Describe tu problema o escribe tu pregunta..."></textarea>
      <button id="send-btn" onclick="sendMessage()" aria-label="Enviar">➤</button>
    </div>
  </div>

  <div class="app-footer">
    <span class="footer-note">Asistente técnico · DECOM 2026</span>
  </div>
</div>

<script>
// ── PON TU API KEY AQUÍ ──────────────────────
const GROQ_API_KEY = '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';
// ────────────────────────────────────────────

const MANUAL = `
MANUAL DE LUCES — IPUC CENTRAL CALI — DECOM 2026
Aplicación: ADJ myDMX 3, archivo "SWITCH IPUC CENTRAL"

1. INICIO DE APLICACIÓN
- Dar doble click a la aplicación ADJ llamada "SWITCH IPUC CENTRAL".
- Verificar que la interfaz USB diga "PC" y que la aplicación valide el dispositivo.
- Si la interfaz no dice "PC" sino otro símbolo o número, el programa no la detectará.

2. ENCENDIDO DE LUCES
- Dar click en el apartado LIVE.
- Seleccionar la escena deseada para el servicio.
- Ajustar la intensidad con el DIMMER MAESTRO ubicado al lado derecho del programa.
- Verificar que la única opción activa del panel sea FADE (blanco = activo, gris = inactivo).

3. CREACIÓN DE ESCENA
- Ir al apartado EDIT.
- Seleccionar el botón "+" en la sección MIX para crear nueva escena.
- Configurar colores desde el menú FADER o PALETTE (formato RGB).
- Subir el DIMMER INDIVIDUAL de cada grupo de luces (primera casilla en FADER).
- Ajustar colores con la barra deslizante (FADER) o seleccionando el punto (PALETTE).
- Repetir con cada modelo de luces.
- Asignar nombre descriptivo a la escena.
- Guardar: ARCHIVO → GUARDAR (o Ctrl+S).

4. FALLOS Y SOLUCIONES

Fallo A — Error al crear escena nueva:
- Causa: hay una escena activa en LIVE cuando se entra a EDIT.
- Solución: desactivar la escena en LIVE antes de entrar a EDIT.

Fallo B — Sistema desconectado del universo de luces:
- Solución: EDITAR → PREFERENCIAS → DEVICES → en columna SOFTWARE seleccionar UNIVERSO 1.

Fallo C — Interfaz de luces no detectada:
- Causa: la interfaz USB no muestra "PC".
- Solución: verificar físicamente que la cajita USB muestre exactamente "PC".

Fallo D — Luces no encienden (causa más común):
- Causa: en el panel LIVE hay activa una función diferente a FADE.
- Solución: verificar que solo FADE esté en blanco (activo). Desactivar cualquier otra función en blanco.

Fallo E — Cable XLR dañado (poco común):
- Causa: el cable XLR que conecta luces con la interfaz USB está dañado.
- Solución: reemplazar el cable XLR.
`;

const SYSTEM_PROMPT = `Eres un técnico de soporte experto en el sistema de luces ADJ myDMX 3 de la IPUC Central Cali. Tu trabajo es diagnosticar y resolver problemas de forma conversacional, como lo haría un técnico por WhatsApp.

ESTILO DE RESPUESTA:
- Habla de forma natural, cercana y directa. Como si le escribieras a un compañero.
- NUNCA digas "según el manual" ni mandes a la persona a leer nada.
- NUNCA listes todas las causas posibles de golpe. Diagnostica de a una cosa a la vez.
- Haz UNA sola pregunta de diagnóstico a la vez para ir descartando causas.
- Cuando identifiques el problema, da la solución clara y en pasos numerados.
- Si el problema se resuelve, confirma con el usuario.
- Máximo 3-4 oraciones por mensaje. Sé conciso.

LÓGICA DE DIAGNÓSTICO — sigue este orden según el problema:

Si las luces NO ENCIENDEN, diagnostica en este orden:
1. Primero pregunta: ¿El DIMMER MAESTRO (la barra de la derecha) está subido?
2. Si sí → pregunta: ¿En el panel LIVE, la opción FADE está en blanco (activa)?
3. Si sí → pregunta: ¿La cajita USB (interfaz) dice "PC" en su pantalla?
4. Si sí → pregunta: ¿Hay una escena seleccionada en LIVE?
5. Si todo está bien → sugiere revisar el cable XLR.

Si la APLICACIÓN NO INICIA o no detecta el dispositivo:
1. Primero pregunta: ¿La cajita USB dice "PC" en su pantalla?
2. Si sí → pregunta: ¿La aplicación muestra el dispositivo myDMX 3 como conectado?
3. Si no → guiar a reconectar el universo: EDITAR → PREFERENCIAS → DEVICES → UNIVERSO 1.

Si hay problemas al CREAR UNA ESCENA:
1. Primero pregunta: ¿Tenías una escena activa en LIVE cuando entraste a EDIT?
2. Si sí → esa es la causa. Solución: salir de EDIT, desactivar la escena en LIVE, volver a EDIT.

INFORMACIÓN DEL MANUAL (úsala para dar soluciones, no para citarla):
${MANUAL}

Si el problema no está en el manual, dilo con honestidad y sugiere contactar directamente al equipo DECOM.`;

const history = [];
const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('user-input');
const sendBtn    = document.getElementById('send-btn');

const suggestions = [
  'Las luces no encienden',
  'La aplicación no detecta el dispositivo',
  'No puedo crear una escena',
  '¿Cómo enciendo las luces?',
  '¿Cómo creo una escena nueva?'
];

function addMessage(role, html, withSuggestions = false) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  const av = document.createElement('div');
  av.className = 'msg-avatar';
  av.textContent = role === 'bot' ? '💡' : '👤';

  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.innerHTML = html;

  if (withSuggestions) {
    const col = document.createElement('div');
    col.style.cssText = 'display:flex;flex-direction:column;gap:8px;';
    col.appendChild(bub);
    const sg = document.createElement('div');
    sg.className = 'suggestions';
    suggestions.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'suggestion-btn';
      btn.textContent = s;
      btn.onclick = () => send(s);
      sg.appendChild(btn);
    });
    col.appendChild(sg);
    wrap.appendChild(av);
    wrap.appendChild(col);
  } else {
    wrap.appendChild(av);
    wrap.appendChild(bub);
  }

  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.id = 'typing';
  const av = document.createElement('div');
  av.className = 'msg-avatar';
  av.textContent = '💡';
  const bub = document.createElement('div');
  bub.className = 'bubble typing-dots';
  bub.innerHTML = '<span></span><span></span><span></span>';
  wrap.appendChild(av);
  wrap.appendChild(bub);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function formatResponse(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/^(\d+)\.\s(.+)$/gm, '<li>$2</li>')
    .replace(/(<li>[\s\S]*?<\/li>)/g, m => `<ol>${m}</ol>`)
    .replace(/^[-•]\s(.+)$/gm, '<li>$1</li>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

async function send(text) {
  if (!text.trim()) return;

  addMessage('user', text.replace(/</g, '&lt;'));
  history.push({ role: 'user', content: text });
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;
  showTyping();

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${GROQ_API_KEY}`
      },
      body: JSON.stringify({
        model: 'llama-3.1-8b-instant',
        max_tokens: 400,
        temperature: 0.4,
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          ...history
        ]
      })
    });

    const data = await res.json();

    if (res.status === 401) {
      removeTyping();
      addMessage('bot', '⚠️ La API key no es válida. Abre el archivo HTML en un editor de texto y reemplaza <strong>REEMPLAZA_CON_TU_API_KEY</strong> con tu key de Groq.');
      sendBtn.disabled = false;
      return;
    }

    const reply = data.choices?.[0]?.message?.content || 'No pude obtener respuesta. Intenta de nuevo.';
    history.push({ role: 'assistant', content: reply });
    removeTyping();
    addMessage('bot', formatResponse(reply));

  } catch (e) {
    removeTyping();
    addMessage('bot', '⚠️ Error de conexión. Verifica que tienes internet e intenta de nuevo.');
  }

  sendBtn.disabled = false;
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function sendMessage() { send(inputEl.value.trim()); }

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

inputEl.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// Mensaje inicial
addMessage('bot',
  '¡Hola! Soy el asistente técnico de luces de la <strong>IPUC Central Cali</strong>. 👋<br><br>Cuéntame qué está pasando y te ayudo a resolverlo.',
  true
);
</script>
</body>
</html>
